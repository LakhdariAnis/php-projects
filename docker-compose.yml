# Runs the three projects locally:
#   clinic-booking          http://localhost:8080/clinic-booking/
#   php-pdo-form            http://localhost:8080/php-pdo-form/
#   laravel-student-manager http://localhost:8000
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: damsmsdb
    volumes:
      - ./clinic-booking/damsmsdb.sql:/docker-entrypoint-initdb.d/01-clinic.sql:ro
      - ./clinic-booking/demo-data.sql:/docker-entrypoint-initdb.d/02-clinic-demo.sql:ro
      - ./php-pdo-form/database.sql:/docker-entrypoint-initdb.d/03-pdo-form.sql:ro

  web:
    build: ./docker
    environment:
      DB_HOST: db
    ports:
      - "8080:80"
    volumes:
      - ./clinic-booking:/var/www/html/clinic-booking
      - ./php-pdo-form:/var/www/html/php-pdo-form
    depends_on:
      - db

  laravel:
    image: php:8.3-cli
    user: "1000:1000"
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./laravel-student-manager:/app
    command: >
      sh -c "([ -d vendor ] || (echo Run composer install first && exit 1)) &&
             ([ -f .env ] || (cp .env.example .env && php artisan key:generate)) &&
             touch database/database.sqlite &&
             php artisan migrate:fresh --seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
